[package]
name = "quiet-list"
version = "0.1.0"
description = "A wxDragon list of any length whose rows can change without the screen reader reading them out again"
readme = "README.md"
repository = "https://github.com/trypsynth/quiet-list"
keywords = ["wxdragon", "accessibility", "screen-reader", "accesskit", "list"]
categories = ["accessibility", "gui"]
license = "MIT"
edition = "2024"
rust-version = "1.88"

[dependencies]
wxdragon = { version = "0.9.24", default-features = false }

[target.'cfg(windows)'.dependencies]
accesskit = "0.25.1"
accesskit_windows = "0.35.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
absolute_paths = "warn"
# accesskit_windows and wxdragon pin different windows crate versions, which a library has no
# say in.
multiple_crate_versions = "allow"
